name: Deploy to Production

on:
  push:
    branches:
      - master # master 브랜치에 push될 때 실행
  workflow_dispatch: # 수동 실행도 가능

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 공인망 SSH 노출 대신 tailnet에 잠깐 합류해서 홈서버로 직접 접속
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Pull code, build base container, and prepare SQLx
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: 100.81.204.65
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: DATABASE_URL
          script: |
            cd /home/kdh/Omninews/Omninews_back
            git pull origin master
            docker-compose -f docker-compose.prod.base.yml -p omninews_prod up --build -d

            # Wait for MySQL to be ready
            echo "Waiting for MySQL to be ready..."
            until docker exec omninews_mysql_prod mysqladmin ping -h localhost --silent; do
              echo "MySQL is unavailable - sleeping"
              sleep 2
            done
            echo "MySQL is up - executing sqlx prepare"

            # Prepare SQLx with localhost connection
            export DATABASE_URL=$(echo "${DATABASE_URL}" | sed 's/@mysql:/@localhost:/g')
            cargo sqlx prepare -- --bin OmniNews

      - name: Build and deploy production container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.81.204.65
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/kdh/Omninews/Omninews_back
            docker-compose -f docker-compose.prod.yml -p omninews_prod up --build -d
            docker ps | grep omninews_prod
